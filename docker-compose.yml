# Local stack: PostgreSQL + AURORA Web.
# Secrets are read from a .env file next to this file (copy .env.example and fill it in). Never commit .env.
services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${AURORA_DB_PASSWORD:?Set AURORA_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aurora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 5s
      timeout: 5s
      retries: 10

  aurora-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurora-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Local stack only: it serves plain HTTP on localhost. Any shared deployment must sit behind TLS
      # and leave this at its default (true).
      Security__RequireHttps: "false"
      ConnectionStrings__AuroraDb: "Host=postgres;Port=5432;Database=aurora;Username=aurora;Password=${AURORA_DB_PASSWORD:?Set AURORA_DB_PASSWORD in .env}"
      Seed__AdminPassword: ${AURORA_ADMIN_PASSWORD:-}
      AI__Provider: ${AURORA_AI_PROVIDER:-None}
      AI__Endpoint: ${AURORA_AI_ENDPOINT:-}
      AI__Model: ${AURORA_AI_MODEL:-}
      AI__ApiKey: ${AURORA_AI_API_KEY:-}
    volumes:
      - aurora-dataprotection-keys:/home/app/keys
    ports:
      - "8080:8080"

volumes:
  aurora-postgres-data:
  aurora-dataprotection-keys:
