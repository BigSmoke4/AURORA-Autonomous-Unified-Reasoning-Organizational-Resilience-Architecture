name: probe-versions
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NuGet versions
        run: |
          out=""
          for id in FluentValidation.AspNetCore AspNetCore.HealthChecks.NpgSql Microsoft.AspNetCore.Mvc.Testing Microsoft.NET.Test.Sdk xunit xunit.runner.visualstudio OpenTelemetry.Exporter.Console Microsoft.AspNetCore.SignalR.Client dotnet-ef OpenTelemetry.Instrumentation.Runtime Microsoft.AspNetCore.Authentication.Cookies Microsoft.Extensions.Http.Resilience Microsoft.Extensions.Http.Polly Microsoft.AspNetCore.RateLimiting; do
            v=$(curl -s "https://api.nuget.org/v3-flatcontainer/$(echo $id | tr A-Z a-z)/index.json" | python3 -c "import json,sys;v=json.load(sys.stdin)['versions'];print(' '.join([x for x in v if '-' not in x][-4:]))" 2>/dev/null)
            out="$out | $id: $v"
          done
          echo "VERSIONS: $out"
          echo "$out" > versions.txt
          echo "::notice title=versions::$out"
