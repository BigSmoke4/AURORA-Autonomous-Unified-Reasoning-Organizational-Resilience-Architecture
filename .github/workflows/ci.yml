name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run, so CI reflects the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_test
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      AURORA_TEST_CONNECTION: "Host=localhost;Port=5432;Database=aurora_test;Username=aurora;Password=ci_only_password"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Aurora.sln

      - name: Vulnerable package audit
        run: |
          dotnet list Aurora.sln package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::A referenced package has a known vulnerability. See the log above."
            exit 1
          fi

      - name: Build
        run: |
          echo "::add-matcher::.github/matchers/msbuild.json"
          dotnet build Aurora.sln --no-restore -c Release -warnaserror

      - name: TEMP probe model diff
        continue-on-error: true
        run: |
          "$HOME/.dotnet/tools/dotnet-ef" migrations add ProbeDiff --no-build --project src/Web/Aurora.Web/Aurora.Web.csproj --startup-project src/Web/Aurora.Web/Aurora.Web.csproj --output-dir ProbeOut > probe-add.txt 2>&1 || true
          echo "migrations add exit printed above"
          python3 - <<'PY2'
import glob, re
text = open("probe-add.txt", encoding="utf-8", errors="replace").read()
lines = [l for l in text.splitlines() if l.strip()]
def emit(msg):
    msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
    print("::error title=probe::" + msg)
emit("ADD OUTPUT tail: " + " | ".join(lines[-6:])[-3000:])
for f in glob.glob("src/Web/Aurora.Web/ProbeOut/*.cs") + glob.glob("src/Web/Aurora.Web/Migrations/*Probe*.cs"):
    if f.endswith("Designer.cs"):
        continue
    s = open(f, encoding="utf-8").read()
    m = re.search(r"Up\(MigrationBuilder migrationBuilder\)(.*?)protected override void Down", s, re.S)
    body = re.sub(r"\s+", " ", m.group(1) if m else s)
    ops = [o.strip() for o in body.split("migrationBuilder.") if o.strip()]
    emit("FILE " + f + " ops=" + str(len(ops)))
    chunk = ""
    for o in ops:
        piece = "[" + o + "] "
        if len(chunk) + len(piece) > 3000:
            emit(chunk)
            chunk = ""
        chunk += piece
    if chunk:
        emit(chunk)
PY2

      - name: Verify EF Core model matches migrations
        env:
          ConnectionStrings__AuroraDb: ${{ env.AURORA_TEST_CONNECTION }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          "$HOME/.dotnet/tools/dotnet-ef" migrations has-pending-model-changes --project src/Web/Aurora.Web/Aurora.Web.csproj --startup-project src/Web/Aurora.Web/Aurora.Web.csproj

      - name: Unit and integration tests
        run: dotnet test Aurora.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Report test results
        if: always()
        run: python3 .github/scripts/report-test-results.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aurora_test
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora -d aurora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AURORA_CONTAINER_CONNECTION: "Host=localhost;Port=5432;Database=aurora_test;Username=aurora;Password=ci_only_password"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the web image
        run: docker build --tag aurora-web:ci .

      - name: Start the container in Production mode
        run: |
          docker run --detach --name aurora-web --network host \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e Security__RequireHttps=false \
            -e ConnectionStrings__AuroraDb="$AURORA_CONTAINER_CONNECTION" \
            aurora-web:ci

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/health/ready > /dev/null; then
              echo "Ready after attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          # Surface the diagnostics as annotations, so a failure is readable from the check run.
          echo "::error::The container did not become ready."
          echo "::error::Container state: $(docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}}' aurora-web 2>&1 || true)"
          echo "::error::Readiness response: $(curl --silent --show-error --write-out ' [HTTP %{http_code}]' http://localhost:8080/health/ready 2>&1 || true)"
          # One annotation holds the whole log tail. Newlines are escaped so the workflow command stays on one line.
          encoded=$(docker logs --tail 400 aurora-web 2>&1 | head -c 12000 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); gsub(/\r/,""); print}')
          echo "::error::Container log (tail): ${encoded}"
          exit 1

      - name: Smoke checks
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8080/health/live > /dev/null
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" http://localhost:8080/Account/Login)
          test "$status" = "200"
          headers=$(curl --silent --head http://localhost:8080/Account/Login)
          echo "$headers" | grep -qi "^content-security-policy:.*script-src 'self'"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"

      - name: Container logs
        if: always()
        run: docker logs aurora-web || true

      - name: Stop the container
        if: always()
        run: docker rm --force aurora-web || true
